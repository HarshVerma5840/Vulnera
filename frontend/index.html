<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>

  <!-- ── Navigation ────────────────────────────────────────────── -->
  <nav class="nav hidden" id="mainNav">
    <a class="nav-brand" href="#/scan">
      <div class="nav-logo">V</div>
      <span class="nav-title">Vulnera<span>.</span></span>
    </a>

    <ul class="nav-links" id="navLinks">
      <li>
        <a class="nav-link" data-route="#/scan">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Scan
        </a>
      </li>
      <li>
        <a class="nav-link" data-route="#/history">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          History
        </a>
      </li>
    </ul>

    <div class="nav-user">
      <span class="nav-email" id="navEmailText"></span>
      <button class="nav-logout" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <!-- ── App Container (pages render here) ─────────────────────── -->
  <main class="app-container" id="app">
    <!-- Page content injected by JS router -->
  </main>

  <!-- ── Scripts (order matters: modules before router) ─────── -->
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/scanner.js"></script>
  <script src="/frontend/js/history.js"></script>
  <script src="/frontend/js/report.js"></script>

</body>
</html>
